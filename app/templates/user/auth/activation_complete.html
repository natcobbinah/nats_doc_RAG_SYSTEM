{% extends 'base.html' %}

{% block content %}
<div class="container py-5 h-100">
    <div class="row d-flex align-items-center justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
            <p>Account activation completed for user with email <b>{{ email }}</b></p>
            <a href="{{ url_for('auth_route.login') }}">Login to your account</a>

        </div>

        <div class="col-md-8 col-lg-7 col-xl-6">
            <img src="{{url_for('static', filename='assets/activation_complete.svg')}}" class="img-fluid"
                alt="Phone image">
        </div>
    </div>
</div>
{% endblock content %}
